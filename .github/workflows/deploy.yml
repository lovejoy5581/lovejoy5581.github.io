name: Deploy Vue Blog to GitHub Pages

on:
  push:
    branches: ['source']          # 当推送到 source 分支时自动触发

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4          # 升级到 v4，支持 Node.js 24

      - name: Setup Node.js
        uses: actions/setup-node@v4        # 升级到 v4
        with:
          node-version: '22'               # 使用 Node.js 22 LTS（推荐）
          cache: 'npm'                     # 缓存 node_modules 加速构建

      - name: Install dependencies
        run: npm ci                        # 利用 package-lock.json 快速安装

      - name: Build project
        run: npm run build                 # 执行构建命令，生成 dist 目录

      - name: Setup Pages
        uses: actions/configure-pages@v4   # 配置 GitHub Pages 环境

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'                   # 上传构建产物

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4      # 部署到 GitHub Pages